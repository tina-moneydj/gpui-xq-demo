[workspace]
members = [".", "crates/xq-feed", "crates/xq-tape"]

[package]
name = "gpui-xq-demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[dependencies]
xq-feed = { path = "crates/xq-feed" }
xq-tape = { path = "crates/xq-tape" }
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["wayland", "x11"] }
futures = "0.3.34"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[features]
# macOS：執行時才編 Metal shader（不需要 Xcode 的 Metal 工具鏈；啟動會慢一點，bench/mac 會記錄用了哪一種）
runtime-shaders = ["gpui_platform/runtime_shaders"]

[profile.release]
strip = true
debug = false
lto = "thin"
codegen-units = 4
