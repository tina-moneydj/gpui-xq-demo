[workspace]
members = [".", "crates/xq-feed", "crates/xq-tape", "crates/xq-tokens", "crates/xq-ws-bridge"]
# 手機版（Android）是獨立的 crate／Cargo.lock（gpui-pre 0.3.9 + gpui-mobile），不進桌面版 workspace
exclude = ["mobile"]

[package]
name = "gpui-xq-demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[dependencies]
xq-feed = { path = "crates/xq-feed" }
xq-tape = { path = "crates/xq-tape" }
xq-tokens = { path = "crates/xq-tokens" }
gpui = { package = "gpui-pre", version = "=0.3.7", default-features = false }
futures = "0.3.34"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["wayland", "x11"] }

# 網頁版（wasm32-unknown-unknown）：gpui_web（Zed 2026-02 合併的瀏覽器平台，WebGPU 優先、WebGL2 備援）。
# 不經過 gpui_platform：它會開 gpui_web 的預設 feature "multithreaded"（wasm_thread，要 nightly），這裡用單執行緒。
[target.'cfg(target_arch = "wasm32")'.dependencies]
gpui_web = { package = "gpui-pre-web", version = "=0.3.7", default-features = false }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-time = "1"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "UrlSearchParams", "Performance", "console", "HtmlCanvasElement", "WebSocket", "MessageEvent", "BinaryType"] }

[profile.release]
strip = true
debug = false
lto = "thin"
codegen-units = 4
