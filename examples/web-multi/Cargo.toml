[package]
name = "xq-web-multi-gpui"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false
description = "可行性範例：同一個 html 頁面嵌 4 個 GPUI 元件（gpui_web 一個 Application 只能開一個視窗＝一張 canvas，所以每格各自一個 wasm instance）"

# 獨立 crate（不進根目錄 workspace，見根目錄 Cargo.toml 的 exclude）：桌面版建置不受影響。
# 報價表、走勢圖直接用 ../../src/*.rs（#[path]），相依版本與根目錄網頁版相同。
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
xq-feed = { path = "../../crates/xq-feed" }
xq-tape = { path = "../../crates/xq-tape" }
xq-tokens = { path = "../../crates/xq-tokens" }
gpui = { package = "gpui-pre", version = "=0.3.7", default-features = false }
futures = "0.3.34"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gpui_web = { package = "gpui-pre-web", version = "=0.3.7", default-features = false }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-time = "1"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "UrlSearchParams", "Performance", "console", "HtmlCanvasElement", "WebSocket", "MessageEvent", "BinaryType"] }

[profile.release]
strip = true
debug = false
lto = "thin"
codegen-units = 4

# 獨立 crate，不屬於根目錄 workspace（根目錄 exclude 也有列）
[workspace]
