# macOS 預先編譯版：GPUI＋行情產生器（arm64+x86_64 通用執行檔、ad-hoc 簽章）＋ bench/mac 工具包
# 產出：
#   - artifact xq-bench-mac-gpui（zip）
#   - 預發行版 mac-bench-latest：xq-bench-mac-gpui.zip（只有 GPUI，公開）
# egui-xq-demo（公開 repo）的 macOS workflow 會下載這個 zip、加進 egui 執行檔，發佈完整版 xq-bench-mac.zip（公開 release）。
# 網頁情境（web）：從 main 分支的 examples/web-multi 編 GPUI 網頁版（wasm）放進 web/gpui；egui 那邊的 workflow 再加 web/egui。
name: macos
on:
  push:
    branches: [mac-bench]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26          # Apple Silicon、Xcode 26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Metal toolchain（Xcode 26 要另外下載；失敗就改用 runtime-shaders）
        id: metal
        run: |
          xcodebuild -version || true
          xcrun -sdk macosx metal --version 2>&1 | head -3 || true
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then xcodebuild -downloadComponent MetalToolchain || true; fi
          echo 'kernel void k(device float *a [[buffer(0)]]) { a[0] = 1.0; }' > /tmp/t.metal
          if xcrun -sdk macosx metal -c /tmp/t.metal -o /tmp/t.air; then echo "feat=" >> "$GITHUB_OUTPUT"; echo "shaders=precompiled" >> "$GITHUB_OUTPUT"
          else echo "feat=--features runtime-shaders" >> "$GITHUB_OUTPUT"; echo "shaders=runtime" >> "$GITHUB_OUTPUT"; fi
      - name: Rust
        run: rustup update stable && rustup default stable && rustup target add aarch64-apple-darwin x86_64-apple-darwin && rustc -V
      - uses: Swatinem/rust-cache@v2
      - name: Build (arm64 + x86_64)
        env: { MACOSX_DEPLOYMENT_TARGET: "11.0" }
        run: |
          for T in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target $T -p gpui-xq-demo -p xq-feed --bins ${{ steps.metal.outputs.feat }}
          done
      - name: 網頁版範例原始碼（main 分支的 examples/web-multi）
        uses: actions/checkout@v4
        with: { ref: main, path: webmain }
      - name: 編 GPUI 網頁版（一頁嵌多個元件；失敗就不放，壓測包的 web 情境會自動略過 GPUI）
        id: web
        continue-on-error: true
        run: |
          [ -f webmain/examples/web-multi/build.sh ] || { echo "main 還沒有 examples/web-multi"; exit 1; }
          rustup target add wasm32-unknown-unknown
          V=$(grep -A1 '^name = "wasm-bindgen"$' webmain/examples/web-multi/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "wasm-bindgen $V"
          wasm-bindgen --version 2>/dev/null | grep -q " $V$" || cargo install wasm-bindgen-cli --version "$V" --locked
          HOMEBREW_NO_AUTO_UPDATE=1 brew install binaryen || true
          (cd webmain/examples/web-multi && ./build.sh)
          mkdir -p web-gpui && cp webmain/dist/web-multi/index.html webmain/dist/web-multi/page.js webmain/dist/web-multi/xq_web_multi_gpui.js webmain/dist/web-multi/xq_web_multi_gpui_bg.wasm web-gpui/
          ls -la web-gpui
      - name: Universal + ad-hoc sign + kit zip
        run: |
          K=xq-bench-mac; mkdir -p $K/bin
          if [ -d web-gpui ]; then mkdir -p $K/web && cp -R web-gpui $K/web/gpui; fi
          cp bench/mac/*.py bench/mac/*.sh bench/mac/*.command bench/mac/README.md $K/
          chmod +x $K/*.command $K/*.sh
          for b in gpui-xq-demo xq-tickgen xq-demofeed; do
            lipo -create -output $K/bin/$b target/aarch64-apple-darwin/release/$b target/x86_64-apple-darwin/release/$b
            codesign --force -s - $K/bin/$b
          done
          printf '{"gpui_rev":"%s","gpui_branch":"%s","shaders":"%s","targets":"universal","xcode":"%s","built":"%s","ci":true}\n' \
            "${GITHUB_SHA::7}" "${GITHUB_REF_NAME}" "${{ steps.metal.outputs.shaders }}" "$(xcodebuild -version | head -1)" "$(date -u +%FT%TZ)" > $K/bin/build-info.json
          cat $K/bin/build-info.json
          ditto -c -k --keepParent $K xq-bench-mac-gpui.zip
          ls -la xq-bench-mac-gpui.zip
      - name: Smoke test（執行檔能啟動、行情產生器能跑）
        run: |
          K=xq-bench-mac
          file $K/bin/*
          ( $K/bin/xq-demofeed --addr 127.0.0.1:47631 & echo $! > /tmp/feed.pid; sleep 2; kill $(cat /tmp/feed.pid) ) || true
          python3 -m py_compile $K/xq_bench_mac.py
      - name: 實際跑一輪（GPUI 主視窗＋重圖表＋網頁；CI 虛擬機的數字不具參考性，只確認 Mac 版真的能開視窗、收行情、量到數字）
        continue-on-error: true
        timeout-minutes: 15
        run: |
          cd xq-bench-mac
          python3 xq_bench_mac.py --apps gpui --scenarios main,heavy,web --runs 1 --no-zip --no-footprint --out "$GITHUB_WORKSPACE/smoke"
          ls -la "$GITHUB_WORKSPACE/smoke"; head -60 "$GITHUB_WORKSPACE/smoke/summary.md" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-mac-gpui, path: smoke, if-no-files-found: ignore, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        with: { name: xq-bench-mac-gpui, path: xq-bench-mac-gpui.zip, retention-days: 30 }
      - name: Publish mac-bench-latest pre-release
        if: github.ref == 'refs/heads/mac-bench'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-bench-latest --cleanup-tag -y 2>/dev/null || true
          gh release create mac-bench-latest xq-bench-mac-gpui.zip --prerelease --target "$GITHUB_SHA" \
            --title "Mac 壓測包（GPUI 版，mac-bench ${GITHUB_SHA::7}）" \
            --notes "自動產生的 macOS 預先編譯版（arm64＋Intel 通用、ad-hoc 簽章、shader=${{ steps.metal.outputs.shaders }}）。只含 GPUI；含 egui 的完整版在 egui-xq-demo 的 mac-bench-latest。下載 → 解壓 → 終端機執行 xattr -dr com.apple.quarantine 資料夾 → ./run-bench.command。說明：bench/mac/README.md"
