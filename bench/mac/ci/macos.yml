# macOS CI（還沒啟用）：把這個檔案移到 .github/workflows/macos.yml 才會跑。
# 目前推送帳號的 GitHub token 沒有 `workflow` 權限，所以無法直接推到 .github/workflows/（GitHub 會拒絕）。
# 有權限的人：git mv bench/mac/ci/macos.yml .github/workflows/macos.yml && git commit && git push
#
# 產出：xq-bench-mac（zip）= bench/mac 工具包 + bin/{gpui-xq-demo,xq-tickgen,xq-demofeed}（arm64+x86_64 通用執行檔、ad-hoc 簽章）
# egui-xq-demo 是私人 repo，由它自己的 workflow 產出 egui-xq-demo 通用執行檔（見 egui-xq-demo/ci/macos.yml），下載後放進 bin/。
name: macos
on:
  push:
    branches: [mac-bench, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26          # Apple Silicon、Xcode 26（2026-07 起 macos-latest 也是這個）
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Metal toolchain（Xcode 26 要另外下載；失敗就改用 runtime-shaders）
        id: metal
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          echo 'kernel void k(device float *a [[buffer(0)]]) { a[0] = 1.0; }' > /tmp/t.metal
          if xcrun -sdk macosx metal -c /tmp/t.metal -o /tmp/t.air; then echo "feat=" >> "$GITHUB_OUTPUT"; echo "shaders=precompiled" >> "$GITHUB_OUTPUT"
          else echo "feat=--features runtime-shaders" >> "$GITHUB_OUTPUT"; echo "shaders=runtime" >> "$GITHUB_OUTPUT"; fi
      - name: Rust
        run: rustup update stable && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build (arm64 + x86_64)
        env: { MACOSX_DEPLOYMENT_TARGET: "11.0" }
        run: |
          for T in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target $T -p gpui-xq-demo -p xq-feed --bins ${{ steps.metal.outputs.feat }}
          done
      - name: Universal + ad-hoc sign + kit zip
        run: |
          K=xq-bench-mac; mkdir -p $K/bin
          cp bench/mac/*.py bench/mac/*.sh bench/mac/*.command bench/mac/README.md $K/
          for b in gpui-xq-demo xq-tickgen xq-demofeed; do
            lipo -create -output $K/bin/$b target/aarch64-apple-darwin/release/$b target/x86_64-apple-darwin/release/$b
            codesign --force -s - $K/bin/$b
          done
          printf '{"gpui_rev":"%s","shaders":"%s","targets":"universal","built":"%s","ci":true}\n' "${GITHUB_SHA::7}" "${{ steps.metal.outputs.shaders }}" "$(date -u +%FT%TZ)" > $K/bin/build-info.json
          ditto -c -k --keepParent $K $K.zip
      - uses: actions/upload-artifact@v4
        with: { name: xq-bench-mac, path: xq-bench-mac.zip, retention-days: 30 }
